name: CICD

on:
  workflow_dispatch:


jobs:
  code:
    runs-on: my-runner
    steps:
      - name: Clone the code
        run: echo "Clonning the code"

  build:
    needs: [code]
    runs-on: my-runner
    steps:
      - name: Build the code
        run: echo "Building using docker"

  test:
    needs: [build]
    runs-on: my-runner
    steps:
      - name: Running test cases
        run: echo "Testing the app"

  deploy:
    needs: [test]
    runs-on: my-runner
    steps:
      - name: Deploying on the machine
        run: echo "Deploying the code"
  
